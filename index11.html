<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Ai bot</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { background-color: #0b0c15; color: #e2e8f0; font-family: 'Inter', sans-serif; overflow-x: hidden; position: relative; }
        h1, h2, h3, button, .brand-font, .nav-item { font-family: 'Montserrat', sans-serif; }
        #canvas-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at center, #1a1c2e 0%, #000000 100%); }
        .glass-card { background: rgba(18, 22, 41, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .input-box { background: rgba(10, 10, 15, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); transition: all 0.3s ease; }
        .input-box:focus { border-color: #818cf8; outline: none; background: rgba(15, 15, 25, 0.9); }
        .nav-item { cursor: pointer; padding-bottom: 2px; border-bottom: 2px solid transparent; transition: all 0.3s; opacity: 0.6; }
        .nav-item.active { border-bottom-color: #6366f1; opacity: 1; color: #fff; }
        .tab-content { display: none; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .loader { border: 2px solid rgba(255,255,255,0.1); border-radius: 50%; border-top: 2px solid #fff; width: 16px; height: 16px; animation: spin 0.8s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .slide { display: none; }
        .slide.active { display: block; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <canvas id="canvas-bg"></canvas>

    <div class="glass-card max-w-6xl w-full rounded-3xl overflow-hidden relative mt-4 min-h-[800px] flex flex-col z-10">
        
        <div class="flex items-center justify-between px-8 py-6 border-b border-white/5 bg-black/20">
            <div class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
                <span class="text-indigo-500">AGTOP</span> GENERATOR
            </div>
            <div class="flex gap-8 text-sm font-semibold tracking-wide">
                <div class="nav-item active" onclick="switchTab('home')">HOME</div>
                <div class="nav-item" onclick="switchTab('feedback')">FEEDBACK</div>
                <div class="nav-item" onclick="switchTab('docs')">DOCS</div>
                <div class="nav-item" onclick="switchTab('support')">SUPPORT</div>
            </div>
        </div>

        <div id="home-content" class="tab-content active flex-1 p-8 md:p-12">
            <h1 class="text-center text-4xl font-extrabold mb-10">DESIGN YOUR COMPANION</h1>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
                <div class="space-y-6 bg-black/10 p-6 rounded-2xl border border-white/5">
                    <input type="password" id="discordToken" class="w-full p-4 rounded-xl input-box text-white" placeholder="Discord Bot Token">
                    <input type="password" id="groqKey" class="w-full p-4 rounded-xl input-box text-white" placeholder="Groq API Key">
                    <button onclick="showSubscribeModal()" class="w-full bg-indigo-600 py-4 rounded-xl font-bold mt-4">FINISH & DOWNLOAD</button>
                </div>
                <div class="p-6">
                    <div id="slide-1" class="slide active">
                        <input type="text" id="charName" class="w-full p-4 rounded-xl input-box text-white mb-4" value="Viper">
                        <input type="text" id="charAge" class="w-full p-4 rounded-xl input-box text-white" value="24">
                    </div>
                </div>
            </div>
        </div>

        <div id="feedback-content" class="tab-content flex-1 p-12">
            <div class="max-w-2xl mx-auto">
                <h2 class="text-3xl font-bold text-white mb-2">Wall of Fame</h2>
                <p class="text-gray-400 mb-8 text-sm italic">Approved "cool" comments will appear here.</p>
                
                <div id="comment-form" class="mb-10 space-y-4">
                    <input type="text" id="guestName" class="w-full p-4 rounded-xl input-box text-white" placeholder="Your Name (e.g. Shadow77)">
                    <textarea id="guestComment" rows="3" maxlength="250" class="w-full p-4 rounded-xl input-box text-white" placeholder="Write something cool about AGTOP..."></textarea>
                    <button onclick="submitComment()" id="submitBtn" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-500 transition">Post Comment</button>
                </div>

                <div id="comments-list" class="space-y-4">
                    </div>
            </div>
        </div>

        <div id="docs-content" class="tab-content p-12">Docs Content...</div>
        <div id="support-content" class="tab-content p-12">Support Content...</div>
    </div>

    <div id="toast" class="fixed top-5 right-5 px-6 py-4 rounded-xl shadow-2xl transform translate-x-full transition-transform duration-300 z-50 bg-indigo-600 text-white font-medium"></div>

    <script>
        // --- CONFIG ---
        const supabaseUrl = 'https://lbqkefepnldqvflzgxrq.supabase.co'; 
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxicWtlZmVwbmxkcXZmbHpneHJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk1Njk0MDksImV4cCI6MjA4NTE0NTQwOX0.2dZylE0-ieqALc9kIpvpTzpxD90HhAclZ_jirirMt20';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        // --- TAB SWITCHING ---
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(`${tabName}-content`).classList.add('active');
            event.currentTarget.classList.add('active');
            if(tabName === 'feedback') loadComments();
        }

        // --- FEEDBACK LOGIC ---
        async function loadComments() {
            const container = document.getElementById('comments-list');
            container.innerHTML = '<div class="loader mx-auto block"></div>';
            const { data } = await supabaseClient.from('comments').select('*').eq('is_approved', true).order('created_at', { ascending: false });
            
            if (data && data.length > 0) {
                container.innerHTML = data.map(c => `
                    <div class="bg-white/5 p-4 rounded-xl border border-white/10 animate-fadeIn">
                        <p class="text-indigo-400 text-[10px] font-bold uppercase tracking-widest mb-1">${c.user_name}</p>
                        <p class="text-gray-200 text-sm leading-relaxed">${c.content}</p>
                    </div>
                `).join('');
            } else {
                container.innerHTML = '<p class="text-gray-600 text-center italic">No approved comments yet. Be the first!</p>';
            }
        }

        async function submitComment() {
            const name = document.getElementById('guestName').value.trim() || 'Guest';
            const content = document.getElementById('guestComment').value.trim();

            if (localStorage.getItem('hasCommented')) return showToast("You already left a comment!", true);
            if (content.length < 5) return showToast("Comment too short!", true);

            const { error } = await supabaseClient.from('comments').insert([{ user_name: name, content: content }]);

            if (error) {
                showToast("Error: " + error.message, true);
            } else {
                localStorage.setItem('hasCommented', 'true');
                showToast("Success! It will show once approved.");
                document.getElementById('comment-form').innerHTML = '<p class="text-indigo-400 text-center font-bold">Thanks for your feedback! ✨</p>';
            }
        }

        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.backgroundColor = isError ? '#ef4444' : '#4f46e5';
            t.classList.remove('translate-x-full');
            setTimeout(() => t.classList.add('translate-x-full'), 3000);
        }

        // --- BACKGROUND ---
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();
        class P {
            constructor() { this.x=Math.random()*canvas.width; this.y=Math.random()*canvas.height; this.s=Math.random()*2; }
            draw() { ctx.fillStyle='rgba(99,102,241,0.2)'; ctx.beginPath(); ctx.arc(this.x,this.y,this.s,0,Math.PI*2); ctx.fill(); }
        }
        for(let i=0;i<100;i++) particles.push(new P());
        function anim() { ctx.clearRect(0,0,canvas.width,canvas.height); particles.forEach(p=>p.draw()); requestAnimationFrame(anim); }
        anim();
    </script>
</body>
</html>
